name: Refresh patched dependency lockfile
on:
  push:
    branches: [security-hardening-nov-2026]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Install patched dependencies
        run: npm ci --no-fund
      - name: Compile application
        run: npm run build
      - name: Commit lockfile only if build passed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Regenerate lockfile for patched Next.js and React"
            git push origin HEAD:security-hardening-nov-2026
          fi
